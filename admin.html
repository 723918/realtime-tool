<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム研修ツール - 管理画面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-4xl mx-auto space-y-6">
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700">
      <h1 class="text-xl font-bold">リアルタイム研修ツール (管理画面)</h1>
      <div>
        ステータス: <span id="status-badge" class="px-3 py-1 rounded-full text-sm bg-yellow-500/20 text-yellow-300">待機中</span>
      </div>
    </div>

    <!-- 画面中央表示（投影用） -->
    <div class="bg-slate-800/50 border border-slate-700 rounded-2xl p-8 text-center min-h-[250px] flex flex-col justify-center items-center">
      <div class="text-xs text-slate-400 mb-2 uppercase tracking-widest font-semibold">現在表示中の質問</div>
      <div id="display-q" class="text-3xl font-bold text-slate-300">〜 まもなく開始いたします 〜</div>
    </div>

    <!-- 操作パネル -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="md:col-span-2">
        <textarea id="input-q" rows="4" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-4 text-white focus:outline-none focus:border-cyan-500" placeholder="表示する質問文を入力..."></textarea>
      </div>
      <div class="flex flex-col gap-3">
        <button id="btn-show" class="flex-1 bg-cyan-600 hover:bg-cyan-500 font-bold rounded-xl transition">質問を表示する</button>
        <button id="btn-wait" class="flex-1 bg-slate-700 hover:bg-slate-600 font-bold rounded-xl transition">待機中にする</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuY2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjMwNjMyODMsImV4cCI6MjAzODYzOTI4M30.c2z54t4GZlS3E3n7B4y-S4mXqB6D0Z8N5P_y4M6G4kE'; // 必要に応じてお持ちのanonキーを入力

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const inputQ = document.getElementById('input-q');
    const displayQ = document.getElementById('display-q');
    const statusBadge = document.getElementById('status-badge');

    async function updateState(status, question) {
      await supabase.from('app_state').upsert({ id: 1, status, question });
    }

    document.getElementById('btn-show').onclick = () => {
      const q = inputQ.value.trim();
      if (!q) return;
      updateState('showing', q);
    };

    document.getElementById('btn-wait').onclick = () => {
      updateState('waiting', '');
    };

    // リアルタイム受信
    supabase.channel('app_state_change')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
        const data = payload.new;
        if (!data) return;
        if (data.status === 'showing') {
          statusBadge.textContent = '質問反映中';
          statusBadge.className = 'px-3 py-1 rounded-full text-sm bg-emerald-500/20 text-emerald-300';
          displayQ.textContent = data.question;
        } else {
          statusBadge.textContent = '待機中';
          statusBadge.className = 'px-3 py-1 rounded-full text-sm bg-yellow-500/20 text-yellow-300';
          displayQ.textContent = '〜 まもなく開始いたします 〜';
        }
      }).subscribe();
  </script>
</body>
</html>
