<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理・スクリーン投影 | Live Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 2px 2px 0px #000, -2px 2px 0px #000, 2px -2px 0px #000, -2px -2px 0px #000;
      will-change: transform;
      animation: danmaku 8s linear forwards;
    }
    @keyframes danmaku {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between relative select-none">

  <!-- ヘッダー -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 p-4 z-50 shadow-lg">
    <div class="max-w-6xl mx-auto flex flex-wrap gap-4 items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xs uppercase font-bold text-slate-400">STATUS:</span>
        <span id="current-status-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-slate-700 text-slate-300 border border-slate-600">待機中</span>
      </div>

      <div class="flex-1 max-w-xl flex gap-2">
        <input type="text" id="question-input" placeholder="投映する質問文を入力..." 
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        <button id="btn-active" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors">質問を表示する</button>
        <button id="btn-waiting" type="button" class="bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors">待機中にする</button>
      </div>

      <div>
        <button id="btn-toggle-view" type="button" class="bg-amber-600 hover:bg-amber-500 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors flex items-center gap-1.5 shadow">
          <span>📝 記録・アンケート管理</span>
          <span id="header-comment-count" class="bg-amber-800/60 text-amber-200 text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 投影スクリーン -->
  <main id="view-screen" class="flex-1 flex flex-col items-center justify-center p-8 relative">
    <div id="display-area" class="text-center z-10 max-w-4xl mx-auto pointer-events-none mb-6">
      <h1 class="text-3xl md:text-5xl font-bold text-slate-400 tracking-wider">〜 まもなく開始いたします 〜</h1>
      <p class="text-slate-500 mt-4 text-base">スマートフォンで手元の画面をご覧ください</p>
    </div>

    <div id="poll-active-view" class="hidden z-10 w-full max-w-2xl bg-slate-950/90 border border-cyan-500/50 rounded-2xl p-6 shadow-2xl backdrop-blur">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
        <span class="px-2.5 py-1 bg-cyan-500/20 text-cyan-300 font-bold text-xs rounded-full border border-cyan-500/30">📊 アンケート集計中</span>
        <h3 id="active-poll-title" class="font-bold text-yellow-300 text-lg"></h3>
      </div>
      <div id="poll-results-bars" class="space-y-4"></div>
      <div class="text-right text-xs text-slate-400 mt-4">総投票数: <span id="total-votes-count" class="font-bold text-cyan-400 text-sm">0</span> 票</div>
    </div>

    <div id="danmaku-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
  </main>

  <!-- 管理パネル -->
  <main id="view-logs" class="flex-1 hidden p-6 max-w-5xl mx-auto w-full z-30 flex flex-col gap-6">
    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <h2 class="text-lg font-bold mb-3 text-cyan-400">📊 アンケートの新規作成・事前ストック</h2>
      <div class="space-y-3 mb-6 pb-6 border-b border-slate-800">
        <input type="text" id="poll-question-input" placeholder="質問を入力" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-cyan-400">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
          <input type="text" id="poll-opt-0" value="はい" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
          <input type="text" id="poll-opt-1" value="いいえ" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
          <input type="text" id="poll-opt-2" placeholder="選択肢3（任意）" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
          <input type="text" id="poll-opt-3" placeholder="選択肢4（任意）" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white">
        </div>
        <button type="button" onclick="createPollStock()" class="w-full py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 font-bold rounded-lg text-sm">➕ アンケートを保存（作成）する</button>
      </div>

      <h3 class="text-sm font-bold text-slate-300 mb-3">📋 作成済みアンケート一覧</h3>
      <div id="poll-stock-list" class="space-y-3 max-h-60 overflow-y-auto pr-1"></div>
    </div>

    <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-2xl flex-1 flex flex-col">
      <div class="flex flex-wrap justify-between items-center gap-4 mb-6 pb-4 border-b border-slate-800">
        <div><h2 class="text-xl font-bold text-slate-100">📝 質問ごとのコメント記録</h2></div>
        <div class="flex items-center gap-2">
          <select id="select-question-filter" onchange="renderCommentsFilter()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white max-w-xs"></select>
          <button id="btn-download-csv" onclick="downloadCSV()" type="button" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2 rounded-lg transition-colors">📥 CSV出力</button>
        </div>
      </div>
      <div id="log-list" class="flex-1 overflow-y-auto max-h-[40vh] grid grid-cols-1 md:grid-cols-2 gap-3 pr-2"></div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuc2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTYzOTcsImV4cCI6MjEwMTMzMjM5N30.fXnGiT7ORh74UmfDwGc0WvWSC5qUTex9u_6HjvVuACw';

    const getHeaders = () => ({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Content-Type': 'application/json'
    });

    const statusBadge = document.getElementById('current-status-badge');
    const displayArea = document.getElementById('display-area');
    const questionInput = document.getElementById('question-input');
    const viewScreen = document.getElementById('view-screen');
    const viewLogs = document.getElementById('view-logs');
    let allComments = [];
    let isShowingLogs = false;

    document.getElementById('btn-active').addEventListener('click', () => updateState('active'));
    document.getElementById('btn-waiting').addEventListener('click', () => updateState('waiting'));
    document.getElementById('btn-toggle-view').addEventListener('click', () => {
      isShowingLogs = !isShowingLogs;
      viewScreen.classList.toggle('hidden', isShowingLogs);
      viewLogs.classList.toggle('hidden', !isShowingLogs);
      if(isShowingLogs) { loadPollStocks(); loadComments(); }
    });

    function renderScreen(status, question) {
      if (status === 'active' && question) {
        statusBadge.textContent = '質問投映中';
        statusBadge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        displayArea.innerHTML = `<div class="inline-block bg-indigo-500/10 text-indigo-400 font-bold px-4 py-1.5 rounded-full text-sm mb-6 border border-indigo-500/20">Q. CURRENT QUESTION</div><h1 class="text-4xl md:text-6xl font-extrabold text-white leading-tight tracking-wide drop-shadow-md">${escapeHtml(question)}</h1>`;
      } else {
        statusBadge.textContent = '待機中';
        statusBadge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-slate-700 text-slate-300 border border-slate-600';
        displayArea.innerHTML = `<h1 class="text-3xl md:text-5xl font-bold text-slate-400 tracking-wider">〜 まもなく開始いたします 〜</h1><p class="text-slate-500 mt-4 text-base">スマートフォンで手元の画面をご覧ください</p>`;
      }
    }

    async function updateState(newStatus) {
      const qText = questionInput.value.trim();
      renderScreen(newStatus, qText);
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/app_state?id=eq.1`, {
          method: 'PATCH',
          headers: getHeaders(),
          body: JSON.stringify({ status: newStatus, question: qText })
        });
      } catch(e){}
    }

    async function createPollStock() {
      const question = document.getElementById('poll-question-input').value.trim();
      if (!question) return;
      const options = [];
      for (let i = 0; i < 4; i++) {
        const val = document.getElementById(`poll-opt-${i}`).value.trim();
        if (val) options.push(val);
      }
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/polls`, {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({ question, options, is_active: false, is_published: false })
        });
      } catch(e){}
      document.getElementById('poll-question-input').value = '';
      loadPollStocks();
    }

    async function loadPollStocks() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/polls?select=*&order=id.desc`, {
          headers: getHeaders()
        });
        const data = await res.json();
        const container = document.getElementById('poll-stock-list');
        if (!data || data.length === 0) { container.innerHTML = '<p class="text-xs text-slate-500">作成済みのアンケートはありません。</p>'; return; }
        container.innerHTML = data.map(p => `
          <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex justify-between items-center">
            <div><div class="font-bold text-sm text-yellow-300">Q. ${escapeHtml(p.question)}</div></div>
            <div>
              ${!p.is_active ? `<button onclick="startPoll(${p.id})" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-lg">🚀 開始</button>` : `<button onclick="stopPoll(${p.id})" class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded-lg">🛑 終了</button>`}
            </div>
          </div>
        `).join('');
      } catch(e){}
    }

    async function startPoll(id) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/polls?is_active=eq.true`, {
          method: 'PATCH',
          headers: getHeaders(),
          body: JSON.stringify({ is_active: false, is_published: false })
        });
        await fetch(`${SUPABASE_URL}/rest/v1/polls?id=eq.${id}`, {
          method: 'PATCH',
          headers: getHeaders(),
          body: JSON.stringify({ is_active: true, is_published: true })
        });
      } catch(e){}
      loadPollStocks();
    }

    async function stopPoll(id) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/polls?id=eq.${id}`, {
          method: 'PATCH',
          headers: getHeaders(),
          body: JSON.stringify({ is_active: false, is_published: false })
        });
      } catch(e){}
      loadPollStocks();
    }

    async function loadComments() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/comments?select=*&order=id.desc`, {
          headers: getHeaders()
        });
        allComments = await res.json();
        document.getElementById('header-comment-count').textContent = Array.isArray(allComments) ? allComments.length : 0;
        updateQuestionFilterOptions();
        renderCommentsFilter();
      } catch(e){}
    }

    function updateQuestionFilterOptions() {
      const select = document.getElementById('select-question-filter');
      if (!Array.isArray(allComments)) return;
      const questions = [...new Set(allComments.map(c => c.question_text || '無題の質問'))];
      select.innerHTML = '<option value="ALL">すべての質問を表示</option>' + questions.map(q => `<option value="${escapeHtml(q)}">${escapeHtml(q)}</option>`).join('');
    }

    function renderCommentsFilter() {
      const selected = document.getElementById('select-question-filter').value;
      const list = document.getElementById('log-list');
      if (!Array.isArray(allComments)) return;
      const filtered = selected === 'ALL' ? allComments : allComments.filter(c => (c.question_text || '無題の質問') === selected);
      if (filtered.length === 0) { list.innerHTML = '<p class="text-slate-500 text-center py-12 text-sm col-span-full">コメントはありません。</p>'; return; }
      list.innerHTML = filtered.map(c => `
        <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl">
          <div class="text-xs text-indigo-400 font-bold mb-1">Q. ${escapeHtml(c.question_text || '無題')}</div>
          <div class="text-sm text-slate-200">${escapeHtml(c.text)}</div>
        </div>
      `).join('');
    }

    function downloadCSV() {
      if (!Array.isArray(allComments) || allComments.length === 0) return;
      let csv = '質問文,コメント\n';
      allComments.forEach(c => {
        csv += `"${(c.question_text || '').replace(/"/g, '""')}","${(c.text || '').replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `comments_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function escapeHtml(str) { return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    async function sync() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?select=*&order=id.desc&limit=1`, {
          headers: getHeaders()
        });
        const data = await res.json();
        if (data && data.length > 0) renderScreen(data[0].status, data[0].question);
      } catch(e){}
    }

    setInterval(sync, 1000);
    setInterval(loadComments, 2000);
    sync();
  </script>
</body>
</html>
