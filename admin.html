<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム研修ツール - 管理画面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    @keyframes danmaku { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    .danmaku-item { position: absolute; white-space: nowrap; font-weight: bold; font-size: 2.2rem; color: #38bdf8; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); animation: danmaku 7s linear forwards; pointer-events: none; z-index: 40; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <div id="danmaku-container" class="fixed inset-0 pointer-events-none overflow-hidden"></div>

  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="fas fa-sliders-h text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg">リアルタイムアンケート <span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full ml-2">ADMIN</span></h1>
        <p class="text-xs text-slate-400">操作 ＆ 投影画面</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30">待機中</span>
      <button id="btn-export" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg transition flex items-center gap-1.5 shadow-md">
        <i class="fas fa-download"></i> 履歴CSV保存
      </button>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <section class="lg:col-span-5 space-y-6">

      <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-3 shadow-xl">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center">
          <i class="fas fa-comment-dots mr-2 text-indigo-400"></i>自由記述・質問コントロール
        </h2>
        <textarea id="input-q" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition resize-none" placeholder="表示する質問文を入力..."></textarea>
        <div class="grid grid-cols-2 gap-3">
          <button id="btn-show-q" class="bg-indigo-600 hover:bg-indigo-500 font-bold py-2.5 px-4 rounded-xl text-sm transition shadow-lg shadow-indigo-600/20">質問を表示</button>
          <button id="btn-standby" class="bg-slate-800 hover:bg-slate-700 font-bold py-2.5 px-4 rounded-xl text-sm border border-slate-700 transition">待機中にする</button>
        </div>
      </div>

      <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5 space-y-3 shadow-xl">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center">
          <i class="fas fa-poll mr-2 text-indigo-400"></i>選択式アンケート機能
        </h2>
        <input type="text" id="poll-title" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-sm" placeholder="アンケートのタイトル...">
        <div class="space-y-2">
          <input type="text" class="poll-opt w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" placeholder="選択肢 1">
          <input type="text" class="poll-opt w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" placeholder="選択肢 2">
          <input type="text" class="poll-opt w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" placeholder="選択肢 3 (任意)">
          <input type="text" class="poll-opt w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs" placeholder="選択肢 4 (任意)">
        </div>
        <button id="btn-show-poll" class="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-cyan-600/20">アンケート開始</button>
      </div>

    </section>

    <section class="lg:col-span-7 space-y-6 flex flex-col">

      <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 flex flex-col items-center justify-center text-center relative min-h-[280px] shadow-xl">
        <span class="text-xs font-bold text-indigo-400 tracking-widest uppercase bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20 mb-4">MAIN SCREEN PREVIEW</span>
        <div id="display-main" class="w-full space-y-4">
          <h3 id="display-text" class="text-2xl font-black text-white leading-relaxed">〜 まもなく開始いたします 〜</h3>
          <div id="poll-results-container" class="hidden space-y-2 text-left max-w-md mx-auto pt-2"></div>
        </div>
      </div>

      <div class="bg-slate-900 rounded-2xl border border-slate-800 p-5 flex-1 flex flex-col shadow-xl">
        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-3 flex items-center justify-between">
          <span><i class="fas fa-list-alt mr-2 text-indigo-400"></i>回答・コメント投稿履歴</span>
          <span id="response-count" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">0件</span>
        </h2>
        <div id="response-log" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 max-h-[200px] overflow-y-auto space-y-2 text-xs font-mono">
          <p class="text-slate-600 italic">まだ投稿はありません</p>
        </div>
      </div>

    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuY2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjMwNjMyODMsImV4cCI6MjAzODYzOTI4M30.c2z54t4GZlS3E3n7B4y-S4mXqB6D0Z8N5P_y4M6G4kE';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const inputQ = document.getElementById('input-q');
    const statusBadge = document.getElementById('status-badge');
    const displayText = document.getElementById('display-text');
    const pollResultsContainer = document.getElementById('poll-results-container');
    const responseLog = document.getElementById('response-log');
    const responseCount = document.getElementById('response-count');
    const danmakuContainer = document.getElementById('danmaku-container');

    let responsesData = [];

    function spawnDanmaku(text) {
      if (!text) return;
      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.textContent = text;
      el.style.top = Math.floor(Math.random() * 65 + 10) + '%';
      danmakuContainer.appendChild(el);
      setTimeout(() => el.remove(), 7000);
    }

    async function updateState(status, question = '', pollOptions = []) {
      const { error } = await supabase.from('app_state').upsert({ 
        id: 1, 
        status: status, 
        question: question, 
        poll_options: pollOptions, 
        updated_at: new Date().toISOString() 
      });
      if (error) alert('DB更新エラー: ' + error.message);
    }

    document.getElementById('btn-show-q').onclick = () => {
      const q = inputQ.value.trim();
      if (q) updateState('showing', q);
    };

    document.getElementById('btn-standby').onclick = () => {
      updateState('waiting', '');
    };

    document.getElementById('btn-show-poll').onclick = () => {
      const title = document.getElementById('poll-title').value.trim();
      const opts = Array.from(document.querySelectorAll('.poll-opt')).map(i => i.value.trim()).filter(v => v !== '');
      if (title && opts.length >= 2) {
        updateState('poll', title, opts);
      } else {
        alert('タイトルと2つ以上の選択肢を入力してください。');
      }
    };

    function render(data) {
      if (!data) return;
      if (data.status === 'showing') {
        statusBadge.textContent = '質問反映中';
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
        displayText.textContent = data.question;
        pollResultsContainer.classList.add('hidden');
      } else if (data.status === 'poll') {
        statusBadge.textContent = 'アンケート実施中';
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30';
        displayText.textContent = data.question;
        renderPollResults(data.poll_options || []);
        pollResultsContainer.classList.remove('hidden');
      } else {
        statusBadge.textContent = '待機中';
        statusBadge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30';
        displayText.textContent = '〜 まもなく開始いたします 〜';
        pollResultsContainer.classList.add('hidden');
      }

      if (data.last_comment) spawnDanmaku(data.last_comment);
    }

    function renderPollResults(options) {
      const counts = {};
      options.forEach(opt => counts[opt] = 0);
      const pollVotes = responsesData.filter(r => r.type === 'poll_vote');
      pollVotes.forEach(v => { if (counts[v.content] !== undefined) counts[v.content]++; });
      const total = pollVotes.length || 1;

      pollResultsContainer.innerHTML = options.map(opt => {
        const count = counts[opt] || 0;
        const pct = Math.round((count / total) * 100);
        return `
          <div>
            <div class="flex justify-between text-xs mb-1 font-bold">
              <span>${opt}</span>
              <span>${count}票 (${pct}%)</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden border border-slate-700">
              <div class="bg-indigo-500 h-full transition-all duration-500" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function loadResponses() {
      const { data } = await supabase.from('app_responses').select('*').order('created_at', { ascending: false });
      if (data) {
        responsesData = data;
        responseCount.textContent = `${data.length}件`;
        if (data.length === 0) {
          responseLog.innerHTML = '<p class="text-slate-600 italic">まだ投稿はありません</p>';
        } else {
          responseLog.innerHTML = data.map(r => `
            <div class="border-b border-slate-800/60 pb-1 flex justify-between">
              <span class="${r.type === 'poll_vote' ? 'text-cyan-400' : 'text-slate-200'}">[${r.type === 'poll_vote' ? '投票' : '発言'}] ${r.content}</span>
              <span class="text-slate-600 text-[10px]">${new Date(r.created_at).toLocaleTimeString()}</span>
            </div>
          `).join('');
        }
      }
    }

    document.getElementById('btn-export').onclick = () => {
      if (responsesData.length === 0) return alert('出力する回答データがありません');
      let csv = '日時,種別,内容\n';
      responsesData.forEach(r => {
        csv += `"${new Date(r.created_at).toLocaleString()}","${r.type}","${r.content.replace(/"/g, '""')}"\n`;
      });
      const blob = new Blob([new Uint8Array([0xEF, 0xBB, 0xBF]), csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `回答履歴_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    };

    supabase.from('app_state').select('*').eq('id', 1).single().then(({ data }) => render(data));
    loadResponses();

    supabase.channel('admin_realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => render(payload.new))
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'app_responses' }, () => loadResponses())
      .subscribe();
  </script>
</body>
</html>
