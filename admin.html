<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイム研修ツール - 管理画面</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      will-change: transform;
      animation: danmaku-move 8s linear forwards;
    }
    @keyframes danmaku-move {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans overflow-x-hidden">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 flex items-center justify-between sticky top-0 z-50 shadow-md">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <i class="fas fa-sliders-h text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight">リアルタイムアンケート <span class="text-xs bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full ml-2">ADMIN</span></h1>
        <p class="text-xs text-slate-400">研修・イベント操作＆スクリーン投影パネル</p>
      </div>
    </div>
    <div class="flex items-center space-x-4">
      <div id="connection-status" class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700/50">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
        <span class="text-xs font-medium text-emerald-300">通信正常</span>
      </div>
    </div>
  </header>

  <!-- 弾幕流れるメインスクリーンエリア -->
  <div id="danmaku-screen" class="relative w-full h-64 bg-slate-900 border-b border-slate-800 overflow-hidden flex flex-col items-center justify-center text-center p-6">
    <div class="absolute top-3 left-4 flex items-center space-x-2 text-xs text-slate-500 font-mono">
      <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
      <span>LIVE SCREEN PREVIEW</span>
    </div>

    <!-- 投影中の質問 -->
    <div class="z-10 bg-slate-950/80 backdrop-blur border border-slate-800 p-6 rounded-2xl max-w-2xl w-full shadow-2xl">
      <span class="text-xs font-bold tracking-widest text-indigo-400 uppercase bg-indigo-500/10 px-3 py-1 rounded-full border border-indigo-500/20 mb-2 inline-block">Q. CURRENT QUESTION</span>
      <h2 id="screen-question" class="text-2xl md:text-3xl font-black text-white leading-snug">〜 まもなく開始いたします 〜</h2>
    </div>
  </div>

  <!-- 操作エリア -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 md:grid-cols-12 gap-6">
    
    <!-- 質問コントロール -->
    <section class="md:col-span-6 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
      <h3 class="text-sm font-bold text-slate-300 flex items-center">
        <i class="fas fa-edit mr-2 text-indigo-400"></i>質問文コントロール
      </h3>
      <textarea id="input-q" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition resize-none" placeholder="表示する質問文を入力..."></textarea>
      
      <div class="grid grid-cols-2 gap-3">
        <button id="btn-show" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2">
          <i class="fas fa-paper-plane"></i>
          <span>質問を表示</span>
        </button>
        <button id="btn-wait" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 px-4 rounded-xl transition border border-slate-700 flex items-center justify-center space-x-2">
          <i class="fas fa-pause"></i>
          <span>待機中にする</span>
        </button>
      </div>
    </section>

    <!-- 回答・記録一覧 -->
    <section class="md:col-span-6 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl flex flex-col h-80">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-sm font-bold text-slate-300 flex items-center">
          <i class="fas fa-comments mr-2 text-indigo-400"></i>受信コメント・回答ログ
        </h3>
        <span id="comment-count" class="text-xs bg-indigo-500/20 text-indigo-300 px-2.5 py-0.5 rounded-full border border-indigo-500/30">0件</span>
      </div>
      <div id="comment-list" class="flex-1 overflow-y-auto space-y-2 pr-1 text-sm text-slate-300">
        <!-- コメントがここに自動追加されます -->
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuY2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjMwNjMyODMsImV4cCI6MjAzODYzOTI4M30.c2z54t4GZlS3E3n7B4y-S4mXqB6D0Z8N5P_y4M6G4kE';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const inputQ = document.getElementById('input-q');
    const screenQ = document.getElementById('screen-question');
    const danmakuScreen = document.getElementById('danmaku-screen');
    const commentList = document.getElementById('comment-list');
    const commentCount = document.getElementById('comment-count');
    let totalComments = 0;

    async function updateState(status, question) {
      await supabase.from('app_state').upsert({ id: 1, status, question });
      fetchState();
    }

    async function fetchState() {
      const { data } = await supabase.from('app_state').select('*').eq('id', 1).single();
      if (!data) return;
      if (data.status === 'showing' && data.question) {
        screenQ.textContent = data.question;
        inputQ.value = data.question;
      } else {
        screenQ.textContent = '〜 まもなく開始いたします 〜';
      }
    }

    // 弾幕（流れるコメント）を画面に出現させる関数
    function spawnDanmaku(text) {
      const el = document.createElement('div');
      el.className = 'danmaku-item text-xl font-bold text-yellow-300 drop-shadow-md z-20';
      el.textContent = text;
      el.style.top = Math.floor(Math.random() * 60 + 10) + '%';
      danmakuScreen.appendChild(el);

      setTimeout(() => el.remove(), 8000);

      // ログに追加
      totalComments++;
      commentCount.textContent = totalComments + '件';
      const log = document.createElement('div');
      log.className = 'bg-slate-950 p-2.5 rounded-lg border border-slate-800/80 text-xs flex justify-between items-center';
      log.innerHTML = `<span class="text-slate-200">${text}</span><span class="text-slate-500 text-[10px]">${new Date().toLocaleTimeString()}</span>`;
      commentList.prepend(log);
    }

    document.getElementById('btn-show').onclick = () => {
      const q = inputQ.value.trim();
      if (q) updateState('showing', q);
    };

    document.getElementById('btn-wait').onclick = () => updateState('waiting', '');

    // 校務ネット対応：定期ポーリング（1秒周期）
    fetchState();
    setInterval(fetchState, 1000);

    // リアルタイムリスナー
    supabase.channel('admin_realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
        if (payload.new) fetchState();
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'responses' }, payload => {
        if (payload.new && payload.new.content) spawnDanmaku(payload.new.content);
      })
      .subscribe();
  </script>
</body>
</html>
