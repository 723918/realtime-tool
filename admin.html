<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理・スクリーン投影 | Live Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    .danmaku-item {
      position: absolute;
      white-space: nowrap;
      font-size: 2.25rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 2px 2px 0px #000, -2px 2px 0px #000, 2px -2px 0px #000, -2px -2px 0px #000;
      will-change: transform;
      animation: danmaku 8s linear forwards;
    }
    @keyframes danmaku {
      from { transform: translateX(100vw); }
      to { transform: translateX(-100%); }
    }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between overflow-hidden relative select-none">

  <!-- 1. 管理操作ヘッダー -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 p-4 z-50 shadow-lg">
    <div class="max-w-6xl mx-auto flex flex-wrap gap-4 items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xs uppercase font-bold text-slate-400">STATUS:</span>
        <span id="current-status-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-yellow-500/20 text-yellow-300 border border-yellow-500/30">
          取得中...
        </span>
      </div>

      <div class="flex-1 max-w-xl flex gap-2">
        <input type="text" id="question-input" placeholder="投映する質問文を入力..." 
          class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        <button id="btn-active" type="button" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors">
          質問を表示する
        </button>
        <button id="btn-waiting" type="button" class="bg-slate-700 hover:bg-slate-600 text-white text-sm font-bold px-4 py-2 rounded-lg transition-colors">
          待機中にする
        </button>
      </div>
    </div>
  </header>

  <!-- 2. 投影スクリーンエリア -->
  <main class="flex-1 flex items-center justify-center p-8 relative">
    <div id="display-area" class="text-center z-10 max-w-4xl mx-auto">
      <!-- JavaScriptで動的書き換え -->
    </div>

    <!-- 3. 弾幕コメントレイヤー -->
    <div id="danmaku-container" class="absolute inset-0 pointer-events-none overflow-hidden z-20"></div>
  </main>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuc2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTYzOTcsImV4cCI6MjEwMTMzMjM5N30.fXnGiT7ORh74UmfDwGc0WvWSC5qUTex9u_6HjvVuACw';
    
    const supabaseClient = window.supabase.createClient 
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : window.supabase.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusBadge = document.getElementById('current-status-badge');
    const displayArea = document.getElementById('display-area');
    const questionInput = document.getElementById('question-input');
    const danmakuContainer = document.getElementById('danmaku-container');
    const btnActive = document.getElementById('btn-active');
    const btnWaiting = document.getElementById('btn-waiting');

    // 画面の描画更新
    function renderScreen(status, question) {
      if (status === 'active') {
        statusBadge.textContent = '質問投映中';
        statusBadge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
        displayArea.innerHTML = `
          <div class="inline-block bg-indigo-500/10 text-indigo-400 font-bold px-4 py-1.5 rounded-full text-sm mb-6 border border-indigo-500/20">
            Q. CURRENT QUESTION
          </div>
          <h1 class="text-4xl md:text-6xl font-extrabold text-white leading-tight tracking-wide drop-shadow-md">
            ${question || '（質問文が設定されていません）'}
          </h1>
        `;
      } else {
        statusBadge.textContent = '待機中';
        statusBadge.className = 'px-3 py-1 text-xs font-bold rounded-full bg-slate-700 text-slate-300 border border-slate-600';
        displayArea.innerHTML = `
          <h1 class="text-3xl md:text-5xl font-bold text-slate-400 tracking-wider">
            〜 まもなく開始いたします 〜
          </h1>
          <p class="text-slate-500 mt-4 text-base">スマートフォンで手元の画面をご覧ください</p>
        `;
      }
    }

    // ボタンのクリックイベント登録
    btnActive.addEventListener('click', () => updateState('active'));
    btnWaiting.addEventListener('click', () => updateState('waiting'));

    // ステータス更新処理
    async function updateState(newStatus) {
      const qText = questionInput.value.trim();
      renderScreen(newStatus, qText);

      const { error } = await supabaseClient.from('app_state').update({ status: newStatus, question: qText }).eq('id', 1);
      if (error) console.error('DB更新エラー:', error);
    }

    // 弾幕メッセージ生成
    function spawnDanmaku(text) {
      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.textContent = text;
      const topPos = Math.floor(Math.random() * 70) + 10;
      el.style.top = `${topPos}%`;
      danmakuContainer.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    // 初期化＆リアルタイム検知
    async function initApp() {
      try {
        const { data } = await supabaseClient.from('app_state').select('*').eq('id', 1).single();
        if (data) {
          renderScreen(data.status, data.question);
          if (data.question) questionInput.value = data.question;
        } else {
          renderScreen('waiting', '');
        }

        // リアルタイム変更の受信
        supabaseClient.channel('admin_app_state')
          .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'app_state' }, payload => {
            renderScreen(payload.new.status, payload.new.question);
          })
          .subscribe();

        supabaseClient.channel('admin_comments')
          .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, payload => {
            spawnDanmaku(payload.new.text);
          })
          .subscribe();
      } catch (e) {
        console.error(e);
        renderScreen('waiting', '');
      }
    }

    initApp();
  </script>
</body>
</html>
