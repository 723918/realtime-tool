<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理・スクリーン投影 | Live Screen</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between p-6">

  <!-- ヘッダー -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 rounded-xl flex justify-between items-center max-w-5xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <span class="text-xs font-bold text-slate-400">STATUS:</span>
      <span id="status-badge" class="px-3 py-1 text-xs font-bold rounded-full bg-slate-700 text-slate-300">待機中</span>
    </div>
    <div class="flex gap-2 flex-1 max-w-lg mx-4">
      <input type="text" id="q-input" placeholder="投映する質問文を入力..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
      <button onclick="sendQuestion()" class="bg-indigo-600 hover:bg-indigo-500 font-bold text-sm px-4 py-2 rounded-lg">質問を表示する</button>
      <button onclick="setWaiting()" class="bg-slate-700 hover:bg-slate-600 font-bold text-sm px-4 py-2 rounded-lg">待機中にする</button>
    </div>
  </header>

  <!-- 投影エリア -->
  <main class="flex-1 flex flex-col items-center justify-center text-center my-12">
    <div id="main-display">
      <h1 class="text-3xl md:text-5xl font-bold text-slate-400">〜 まもなく開始いたします 〜</h1>
    </div>
  </main>

  <script>
    const PROJECT_REF = 'ejffnsefzocobjffdlrz';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuc2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTYzOTcsImV4cCI6MjEwMTMzMjM5N30.fXnGiT7ORh74UmfDwGc0WvWSC5qUTex9u_6HjvVuACw';
    const ENDPOINT = `https://${PROJECT_REF}.supabase.co/rest/v1/app_state?id=eq.1`;

    async function sendQuestion() {
      const q = document.getElementById('q-input').value.trim();
      document.getElementById('status-badge').textContent = '質問投映中';
      document.getElementById('status-badge').className = 'px-3 py-1 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-300';
      document.getElementById('main-display').innerHTML = `<h1 class="text-4xl md:text-6xl font-extrabold text-white">${q}</h1>`;

      await fetch(ENDPOINT, {
        method: 'PATCH',
        headers: {
          'apikey': API_KEY,
          'Authorization': `Bearer ${API_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ status: 'active', question: q })
      });
    }

    async function setWaiting() {
      document.getElementById('status-badge').textContent = '待機中';
      document.getElementById('status-badge').className = 'px-3 py-1 text-xs font-bold rounded-full bg-slate-700 text-slate-300';
      document.getElementById('main-display').innerHTML = `<h1 class="text-3xl md:text-5xl font-bold text-slate-400">〜 まもなく開始いたします 〜</h1>`;

      await fetch(ENDPOINT, {
        method: 'PATCH',
        headers: {
          'apikey': API_KEY,
          'Authorization': `Bearer ${API_KEY}`,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'
        },
        body: JSON.stringify({ status: 'waiting', question: '' })
      });
    }
  </script>
</body>
</html>
