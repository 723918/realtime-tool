<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント参加用 | Live App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-center items-center p-4">

  <main class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 text-center">
    <div id="view-waiting" class="py-8">
      <h2 class="text-xl font-bold mb-2 text-slate-800">待機中</h2>
      <p class="text-sm text-slate-500">画面が開くまでしばらくお待ちください...</p>
    </div>

    <div id="view-active" class="hidden text-left">
      <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md mb-3">受付中の質問</span>
      <h2 id="q-text" class="text-xl font-bold text-slate-900 mb-6"></h2>
      <input type="text" placeholder="コメントを入力" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm mb-3">
      <button class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm">送信する</button>
    </div>
  </main>

  <script>
    const PROJECT_REF = 'ejffnsefzocobjffdlrz';
    const API_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuc2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTYzOTcsImV4cCI6MjEwMTMzMjM5N30.fXnGiT7ORh74UmfDwGc0WvWSC5qUTex9u_6HjvVuACw';
    const ENDPOINT = `https://${PROJECT_REF}.supabase.co/rest/v1/app_state?select=*&id=eq.1`;

    async function syncState() {
      try {
        const res = await fetch(ENDPOINT, {
          headers: { 'apikey': API_KEY, 'Authorization': `Bearer ${API_KEY}` }
        });
        const data = await res.json();
        if (data && data.length > 0) {
          const item = data[0];
          if (item.status === 'active' && item.question) {
            document.getElementById('view-waiting').classList.add('hidden');
            document.getElementById('view-active').classList.remove('hidden');
            document.getElementById('q-text').textContent = item.question;
          } else {
            document.getElementById('view-active').classList.add('hidden');
            document.getElementById('view-waiting').classList.remove('hidden');
          }
        }
      } catch (e) {}
    }

    setInterval(syncState, 1000);
    syncState();
  </script>
</body>
</html>
