<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムアンケート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-6 text-center">
  <div id="box-wait" class="space-y-4">
    <h1 class="text-3xl font-bold text-slate-200">〜 まもなく開始いたします 〜</h1>
    <p class="text-slate-400 text-sm">画面を開いたままお待ちください</p>
  </div>

  <div id="box-show" class="hidden max-w-lg w-full bg-slate-800 border border-slate-700 rounded-2xl p-8 space-y-6">
    <div class="text-xs text-cyan-400 font-bold uppercase tracking-widest">Q. 現在の質問</div>
    <div id="question-text" class="text-2xl font-bold text-white leading-relaxed"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuY2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjMwNjMyODMsImV4cCI6MjAzODYzOTI4M30.c2z54t4GZlS3E3n7B4y-S4mXqB6D0Z8N5P_y4M6G4kE';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const boxWait = document.getElementById('box-wait');
    const boxShow = document.getElementById('box-show');
    const questionText = document.getElementById('question-text');

    function render(status, question) {
      if (status === 'showing' && question) {
        boxWait.classList.add('hidden');
        boxShow.classList.remove('hidden');
        questionText.textContent = question;
      } else {
        boxShow.classList.add('hidden');
        boxWait.classList.remove('hidden');
      }
    }

    // 初期取得
    supabase.from('app_state').select('*').eq('id', 1).single().then(({ data }) => {
      if (data) render(data.status, data.question);
    });

    // リアルタイム同期
    supabase.channel('app_state_change')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
        const data = payload.new;
        if (data) render(data.status, data.question);
      }).subscribe();
  </script>
</body>
</html>
