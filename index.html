<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムアンケート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes danmaku { 0% { transform: translateX(100vw); } 100% { transform: translateX(-100%); } }
    .danmaku-item { position: absolute; white-space: nowrap; font-weight: bold; font-size: 1.8rem; color: #ffffff; text-shadow: 2px 2px 5px rgba(0,0,0,0.9); animation: danmaku 7s linear forwards; pointer-events: none; z-index: 50; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans overflow-hidden relative">

  <!-- 弾幕アニメーション層 -->
  <div id="danmaku-container" class="fixed inset-0 pointer-events-none overflow-hidden"></div>

  <main class="w-full max-w-md mx-auto z-10 space-y-4">

    <!-- 1. 待機画面 -->
    <div id="box-wait" class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl space-y-3">
      <h1 class="text-2xl font-bold text-slate-200">〜 まもなく開始いたします 〜</h1>
      <p class="text-xs text-slate-400">画面を開いたままお待ちください</p>
    </div>

    <!-- 2. 自由記述・質問回答画面 -->
    <div id="box-show" class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Q. 現在の質問</div>
      <div id="q-text" class="text-xl font-bold text-white leading-relaxed"></div>
      
      <div class="pt-4 border-t border-slate-800 space-y-3">
        <input type="text" id="comment-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="回答や意見を入力...">
        <button id="btn-send-comment" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-xl transition text-sm">送信して画面に流す</button>
      </div>
    </div>

    <!-- 3. アンケート投票画面 -->
    <div id="box-poll" class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-4">
      <div class="text-xs font-bold text-cyan-400 uppercase tracking-wider">POLL. アンケート</div>
      <div id="poll-title-text" class="text-lg font-bold text-white"></div>
      
      <div id="poll-options-container" class="space-y-2.5 pt-2"></div>
      <p id="poll-voted-msg" class="hidden text-center text-xs text-emerald-400 font-bold pt-2">✓ 投票を送信しました</p>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuY2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjMwNjMyODMsImV4cCI6MjAzODYzOTI4M30.c2z54t4GZlS3E3n7B4y-S4mXqB6D0Z8N5P_y4M6G4kE';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const boxWait = document.getElementById('box-wait');
    const boxShow = document.getElementById('box-show');
    const boxPoll = document.getElementById('box-poll');
    const qText = document.getElementById('q-text');
    const pollTitleText = document.getElementById('poll-title-text');
    const pollOptionsContainer = document.getElementById('poll-options-container');
    const pollVotedMsg = document.getElementById('poll-voted-msg');
    const commentInput = document.getElementById('comment-input');
    const danmakuContainer = document.getElementById('danmaku-container');

    // 弾幕処理
    function spawnDanmaku(text) {
      if (!text) return;
      const el = document.createElement('div');
      el.className = 'danmaku-item';
      el.textContent = text;
      el.style.top = Math.floor(Math.random() * 65 + 10) + '%';
      danmakuContainer.appendChild(el);
      setTimeout(() => el.remove(), 7000);
    }

    // 自由記述コメント送信
    document.getElementById('btn-send-comment').onclick = async () => {
      const text = commentInput.value.trim();
      if (!text) return;
      commentInput.value = '';
      
      // DB記録＆弾幕トリガー更新
      await supabase.from('app_responses').insert({ type: 'comment', content: text });
      await supabase.from('app_state').update({ last_comment: text, updated_at: new Date() }).eq('id', 1);
    };

    // アンケート投票送信
    async function votePoll(optionText) {
      await supabase.from('app_responses').insert({ type: 'poll_vote', content: optionText });
      pollVotedMsg.classList.remove('hidden');
      const buttons = pollOptionsContainer.querySelectorAll('button');
      buttons.forEach(b => b.disabled = true);
    }

    // 状態描画
    function render(data) {
      if (!data) return;

      if (data.status === 'showing') {
        boxWait.classList.add('hidden');
        boxPoll.classList.add('hidden');
        boxShow.classList.remove('hidden');
        qText.textContent = data.question;
      } else if (data.status === 'poll') {
        boxWait.classList.add('hidden');
        boxShow.classList.add('hidden');
        boxPoll.classList.remove('hidden');
        pollTitleText.textContent = data.question;
        pollVotedMsg.classList.add('hidden');

        // 選択肢ボタン動的生成
        pollOptionsContainer.innerHTML = (data.poll_options || []).map(opt => `
          <button onclick="votePoll('${opt.replace(/'/g, "\\'")}')" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-bold py-3 px-4 rounded-xl text-sm transition text-left flex justify-between items-center">
            <span>${opt}</span>
            <i class="fas fa-chevron-right text-xs text-slate-500"></i>
          </button>
        `).join('');
      } else {
        boxShow.classList.add('hidden');
        boxPoll.classList.add('hidden');
        boxWait.classList.remove('hidden');
      }

      if (data.last_comment) spawnDanmaku(data.last_comment);
    }

    supabase.from('app_state').select('*').eq('id', 1).single().then(({ data }) => render(data));

    supabase.channel('user_realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => render(payload.new))
      .subscribe();
  </script>
</body>
</html>
