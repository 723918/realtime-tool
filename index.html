<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント参加用 | Live App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-6">

  <main class="max-w-md mx-auto w-full my-auto space-y-4">
    <div id="participant-poll-box" class="hidden bg-slate-900 rounded-2xl shadow-xl p-6 text-white border border-cyan-500/50">
      <div class="flex items-center gap-2 text-cyan-400 font-bold text-xs mb-2">
        <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
        <span>LIVE アンケート開催中</span>
      </div>
      <h3 id="participant-poll-q" class="font-bold text-base mb-4 text-yellow-300 leading-relaxed"></h3>
      <div id="participant-poll-options" class="grid grid-cols-1 gap-2.5"></div>
      <p id="poll-voted-msg" class="hidden text-center text-xs text-emerald-400 font-bold mt-3">✓ 回答を送信しました！</p>
    </div>

    <div id="status-card" class="bg-white rounded-2xl shadow-xl p-6 border border-slate-100">
      <div id="view-waiting" class="text-center py-8">
        <div class="inline-block p-4 rounded-full bg-indigo-50 text-indigo-600 mb-4 animate-pulse">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
        <h2 class="text-xl font-bold mb-2 text-slate-800">待機中</h2>
        <p class="text-sm text-slate-500">画面が開くまでしばらくお待ちください...</p>
      </div>

      <div id="view-active" class="hidden">
        <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md mb-3">受付中の質問</span>
        <h2 id="question-text" class="text-xl font-bold text-slate-900 mb-6 leading-relaxed"></h2>

        <form id="comment-form" onsubmit="sendComment(event)" class="space-y-3">
          <input type="text" id="comment-input" placeholder="コメントを入力（スクリーンに流れます）" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow-md">送信する</button>
        </form>
        <p id="send-msg" class="text-xs text-center text-emerald-600 font-bold mt-2 hidden">送信しました！</p>
      </div>
    </div>
  </main>

  <footer class="text-center text-xs text-slate-400 py-4">Live Interactive System</footer>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuc2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NTYzOTcsImV4cCI6MjEwMTMzMjM5N30.fXnGiT7ORh74UmfDwGc0WvWSC5qUTex9u_6HjvVuACw';

    let currentQuestionText = '';

    async function fetchUserAppState() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/app_state?select=*&order=id.desc&limit=1`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        if (data && data.length > 0) {
          const item = data[0];
          currentQuestionText = item.question || '';
          if (item.status === 'active' && item.question) {
            document.getElementById('view-waiting').classList.add('hidden');
            document.getElementById('view-active').classList.remove('hidden');
            document.getElementById('question-text').textContent = currentQuestionText;
          } else {
            document.getElementById('view-active').classList.add('hidden');
            document.getElementById('view-waiting').classList.remove('hidden');
          }
        }
      } catch(e){}
    }

    async function sendComment(e) {
      e.preventDefault();
      const input = document.getElementById('comment-input');
      const text = input.value.trim();
      if (!text) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/comments`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text, question_text: currentQuestionText || '無題の質問' })
        });
        input.value = '';
        const msg = document.getElementById('send-msg');
        msg.classList.remove('hidden');
        setTimeout(() => msg.classList.add('hidden'), 2000);
      } catch(e){}
    }

    async function checkParticipantPoll() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/polls?is_active=eq.true&is_published=eq.true&order=id.desc&limit=1`, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        const data = await res.json();
        if (data && data.length > 0) renderPollForParticipant(data[0]);
        else document.getElementById('participant-poll-box').classList.add('hidden');
      } catch(e){}
    }

    function renderPollForParticipant(poll) {
      document.getElementById('participant-poll-box').classList.remove('hidden');
      document.getElementById('participant-poll-q').textContent = 'Q: ' + poll.question;
      const votedKey = `voted_poll_${poll.id}`;
      const hasVoted = localStorage.getItem(votedKey);
      const optionsContainer = document.getElementById('participant-poll-options');
      optionsContainer.innerHTML = '';

      const opts = Array.isArray(poll.options) ? poll.options : JSON.parse(poll.options || '[]');
      opts.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `w-full py-3 px-4 rounded-xl font-bold text-sm text-left border transition-all ${hasVoted ? 'bg-slate-800/50 border-slate-700 text-slate-500 cursor-not-allowed' : 'bg-slate-800 hover:bg-cyan-900/50 border-cyan-500/50 text-cyan-200'}`;
        btn.textContent = `${idx + 1}. ${opt}`;
        btn.disabled = !!hasVoted;
        btn.onclick = () => submitVote(poll.id, idx);
        optionsContainer.appendChild(btn);
      });
    }

    async function submitVote(pollId, optionIdx) {
      const votedKey = `voted_poll_${pollId}`;
      if (localStorage.getItem(votedKey)) return;
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/poll_votes`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ poll_id: pollId, option_index: optionIdx })
        });
        localStorage.setItem(votedKey, 'true');
        checkParticipantPoll();
      } catch(e){}
    }

    setInterval(fetchUserAppState, 1000);
    setInterval(checkParticipantPoll, 1000);
    fetchUserAppState();
    checkParticipantPoll();
  </script>
</body>
</html>
