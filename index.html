<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>イベント参加用 | Live App</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between p-4 sm:p-6">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_8y8sUdejOFwoCCGpLSqrOQ_gsfAxkGA';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <!-- メインコンテンツ領域 -->
  <main class="max-w-md mx-auto w-full my-auto">
    <!-- カードコンテナ -->
    <div id="status-card" class="bg-white rounded-2xl shadow-xl p-6 transition-all duration-300 border border-slate-100">
      
      <!-- 1. 待機画面 -->
      <div id="view-waiting" class="text-center py-8">
        <div class="inline-block p-4 rounded-full bg-indigo-50 text-indigo-600 mb-4 animate-pulse">
          <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <h2 class="text-xl font-bold mb-2 text-slate-800">待機中</h2>
        <p class="text-slate-500 text-sm leading-relaxed">
          次の質問を準備しています。<br>管理者が質問を表示するまで、このままお待ちください。
        </p>
      </div>

      <!-- 2. 質問表示画面 -->
      <div id="view-question" class="hidden">
        <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-3 py-1 rounded-full mb-3">Q. 質問</span>
        <h2 id="question-text" class="text-xl font-bold text-slate-800 mb-6 leading-snug"></h2>
        
        <p class="text-xs text-slate-400 text-center">※ 画面下のフォームから感想や回答を送ることができます</p>
      </div>

    </div>
  </main>

  <!-- 下部固定：コメント・質問送信フォーム -->
  <footer class="max-w-md mx-auto w-full mt-6">
    <form id="comment-form" class="bg-white rounded-2xl shadow-lg p-2.5 flex gap-2 items-center border border-slate-200">
      <input 
        type="text" 
        id="comment-input" 
        placeholder="コメント・質問を送る..." 
        required 
        class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all"
      />
      <button 
        type="submit" 
        class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-3 rounded-xl text-sm transition-colors flex-shrink-0 flex items-center justify-center shadow-md active:scale-95"
      >
        送信
      </button>
    </form>
  </footer>

  <script>
    const viewWaiting = document.getElementById('view-waiting');
    const viewQuestion = document.getElementById('view-question');
    const questionTextEl = document.getElementById('question-text');
    const commentForm = document.getElementById('comment-form');
    const commentInput = document.getElementById('comment-input');

    // UI切替処理
    function renderState(state) {
      if (!state) return;
      if (state.status === 'question') {
        viewWaiting.classList.add('hidden');
        viewQuestion.classList.remove('hidden');
        questionTextEl.textContent = state.question_text || '（質問内容が空です）';
      } else {
        viewQuestion.classList.add('hidden');
        viewWaiting.classList.remove('hidden');
      }
    }

    // 初期状態の取得
    async function fetchInitialState() {
      const { data, error } = await supabase
        .from('app_state')
        .select('*')
        .eq('id', 1)
        .single();
      
      if (!error && data) {
        renderState(data);
      }
    }

    // app_state 変更のリアルタイム監視
    supabase
      .channel('public:app_state')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
        renderState(payload.new);
      })
      .subscribe();

    // コメント送信処理
    commentForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = commentInput.value.trim();
      if (!content) return;

      commentInput.value = '';

      const { error } = await supabase
        .from('comments')
        .insert([{ content }]);

      if (error) {
        alert('送信エラー: ' + error.message);
      }
    });

    // 初期実行
    fetchInitialState();
  </script>
</body>
</html>
