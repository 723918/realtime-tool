<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>リアルタイムアンケート</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

  <main class="w-full max-w-md mx-auto">
    
    <!-- 待機状態表示 -->
    <div id="state-waiting" class="bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl space-y-4">
      <div class="w-16 h-16 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto border border-indigo-500/20">
        <i class="fas fa-clock text-2xl animate-pulse"></i>
      </div>
      <h1 class="text-2xl font-black text-white leading-tight">〜 まもなく開始いたします 〜</h1>
      <p class="text-xs text-slate-400 leading-relaxed">画面を開いたままお待ちください。<br>進行に合わせて自動的に切り替わります。</p>
    </div>

    <!-- 質問表示＆回答・弾幕送信フォーム -->
    <div id="state-showing" class="hidden bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl space-y-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider flex items-center">
          <i class="fas fa-comment-dots mr-1.5"></i>Q. QUESTION
        </span>
        <span class="flex h-2 w-2 relative">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
      </div>

      <div id="question-text" class="text-xl font-bold text-white leading-relaxed text-center py-2"></div>

      <!-- コメント・回答入力フォーム -->
      <div class="space-y-3 pt-2">
        <input id="reply-input" type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-sm text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition" placeholder="メッセージ・回答を入力..." />
        <button id="btn-send" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2 active:scale-95">
          <i class="fas fa-paper-plane"></i>
          <span>送信する（スクリーンへ流す）</span>
        </button>
        <p id="send-msg" class="text-xs text-center text-emerald-400 hidden font-bold">✓ 送信しました！</p>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://ejffnsefzocobjffdlrz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqZmZuY2Vmem9jb2JqZmZkbHJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjMwNjMyODMsImV4cCI6MjAzODYzOTI4M30.c2z54t4GZlS3E3n7B4y-S4mXqB6D0Z8N5P_y4M6G4kE';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const sWait = document.getElementById('state-waiting');
    const sShow = document.getElementById('state-showing');
    const qText = document.getElementById('question-text');
    const replyInput = document.getElementById('reply-input');
    const btnSend = document.getElementById('btn-send');
    const sendMsg = document.getElementById('send-msg');

    async function fetchState() {
      const { data } = await supabase.from('app_state').select('*').eq('id', 1).single();
      if (!data) return;
      if (data.status === 'showing' && data.question) {
        sWait.classList.add('hidden');
        sShow.classList.remove('hidden');
        qText.textContent = data.question;
      } else {
        sShow.classList.add('hidden');
        sWait.classList.remove('hidden');
      }
    }

    // 回答・弾幕コメントの送信処理
    btnSend.onclick = async () => {
      const text = replyInput.value.trim();
      if (!text) return;
      btnSend.disabled = true;
      
      await supabase.from('responses').insert([{ content: text }]);
      
      replyInput.value = '';
      btnSend.disabled = false;
      sendMsg.classList.remove('hidden');
      setTimeout(() => sendMsg.classList.add('hidden'), 2000);
    };

    // 初回＆定期取得（校務ネット対策）
    fetchState();
    setInterval(fetchState, 1000);

    // リアルタイム同期
    supabase.channel('user_realtime')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state' }, payload => {
        if (payload.new) fetchState();
      }).subscribe();
  </script>
</body>
</html>
